<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Website Unavailable</title>
  <meta name="description" content="This website is currently unavailable.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Website Unavailable">
  <meta property="og:description" content="This website is currently unavailable.">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Website Unavailable">
  <meta name="twitter:description" content="This website is currently unavailable.">

  <style>
    :root {
      --bg: #080b12;
      --bg-soft: #0d111a;
      --card: rgba(17, 23, 34, 0.78);

      --border: rgba(148, 163, 184, 0.18);
      --border-strong: rgba(148, 163, 184, 0.28);

      --text: #f1f5f9;
      --muted: #94a3b8;
      --subtle: #64748b;

      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.5rem;

      display: grid;
      place-items: center;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(96, 165, 250, 0.09),
          transparent 45%
        ),
        var(--bg);
    }

    .status-card {
      width: min(680px, 100%);
      padding: clamp(1.5rem, 3vw, 2.25rem);

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 1rem;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .eyebrow {
      margin: 0 0 0.75rem;

      color: var(--accent);

      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(1.5rem, 3vw, 2rem);
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .message {
      margin: 0.9rem 0 0;

      max-width: 560px;

      color: var(--muted);

      font-size: 1.02rem;
      line-height: 1.65;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.55rem;

      margin: 1.5rem 0 0;
      padding-top: 1rem;

      border-top: 1px solid var(--border);

      color: var(--subtle);
      font-size: 0.875rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .status-card {
        border-radius: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <main class="status-card" role="main">
    <p class="eyebrow">Website status</p>

    <h1>Website temporarily unavailable</h1>

    <p class="message">
      This website is currently unavailable due to domain ownership transfer.
    </p>

  </main>
</body>
</html>
